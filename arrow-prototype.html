<!DOCTYPE html>
<html class="staticrypt-html">
    <head>
        <meta charset="utf-8" />
        <title>Client Pricing System | IODEV</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            :root {
                --brand-navy: #1d202f;
                --brand-surface: #262a3d;
                --brand-border: #353a52;
                --brand-primary: #6d77b0;
                --brand-primary-dark: #535b8c;
                --brand-light: #aeb6d8;
                --brand-pale: #c9cfe5;
                --brand-text: #ffffff;
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--brand-navy);
                color: var(--brand-pale);
                font-family: "Arial", sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-content {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-page {
                width: 400px;
                max-width: 100%;
                padding: 24px 16px;
                box-sizing: border-box;
            }

            .staticrypt-form {
                background: var(--brand-surface);
                padding: 45px;
                box-sizing: border-box;
                text-align: center;
                border: 1px solid var(--brand-border);
                border-radius: 12px;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
            }

            .staticrypt-logo {
                display: block;
                width: 100%;
                max-width: 220px;
                height: auto;
                margin: 0 auto 28px;
            }

            .staticrypt-title {
                font-size: 1.5em;
                font-weight: 600;
                color: var(--brand-text);
                margin: 0;
            }

            .staticrypt-hr {
                margin: 24px 0;
                border: 0;
                border-top: 1px solid var(--brand-border);
            }

            .staticrypt-password-container {
                position: relative;
                margin: 0 0 15px;
            }

            .staticrypt-form input[type="password"],
            .staticrypt-form input[type="text"] {
                display: block;
                width: 100%;
                box-sizing: border-box;
                padding: 15px 46px 15px 15px; /* leave room for the visibility toggle */
                background: var(--brand-navy);
                border: 1px solid var(--brand-border);
                border-radius: 8px;
                color: var(--brand-text);
                font-size: 16px;
                outline: 0;
            }

            .staticrypt-form input[type="password"]::placeholder,
            .staticrypt-form input[type="text"]::placeholder {
                color: var(--brand-light);
                opacity: 0.7;
            }

            .staticrypt-form input[type="password"]:focus,
            .staticrypt-form input[type="text"]:focus {
                border-color: var(--brand-primary);
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                width: 20px;
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                filter: invert(1); /* icons are black; flip for the dark input */
                opacity: 0.5;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                width: 100%;
                padding: 15px;
                background: var(--brand-primary);
                border: 0;
                border-radius: 8px;
                color: #ffffff;
                font-size: 14px;
                font-weight: 600;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                cursor: pointer;
                transition: background 0.15s ease;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--brand-primary-dark);
                outline: 0;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                margin-right: 1em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--brand-light);
                border-right-color: transparent;
                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (max-width: 420px) {
                .staticrypt-form {
                    padding: 32px 24px;
                }
            }
        </style>
    </head>

    <body class="staticrypt-body">
