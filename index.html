<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>IODEV</title>
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 24px;
      background: #202336;
      color: #aeb5d8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 1.1rem;
      line-height: 1.5;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }

    img {
      display: block;
      width: min(280px, 70vw);
      height: auto;
    }

    p { margin: 0; }

    a {
      color: #fff;
      font-weight: 600;
      text-underline-offset: 3px;
    }

    a:hover { color: #cbd0e6; }
  </style>
</head>
<body>
  <img src="{{ '/logo-transparent-bg.png' | relative_url }}" alt="IODEV" width="1989" height="361">
  <p>You may have landed here in error. <a href="https://iodev.com">Back to home.</a></p>
</body>
</html>
